# winwork multi-platform build + release
# Builds all platforms on every release, uploads all binaries to release

name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux x86_64
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winwork-linux-x86_64
          path: src-tauri/target/release/winwork
          retention-days: 1

  # macOS x86_64
  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winwork-macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/winwork
          retention-days: 1

  # macOS ARM64
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winwork-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/winwork
          retention-days: 1

  # Windows x86_64
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winwork-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/winwork.exe
          retention-days: 1

  # Upload all binaries to release
  release:
    needs: [linux, macos-x86_64, macos-arm64, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Prepare binaries
        run: |
          mkdir -p dist
          cp artifacts/winwork-linux-x86_64/winwork dist/winwork-linux-x86_64
          cp artifacts/winwork-macos-x86_64/winwork dist/winwork-macos-x86_64
          cp artifacts/winwork-macos-arm64/winwork dist/winwork-macos-arm64
          cp artifacts/winwork-windows-x86_64/winwork.exe dist/winwork-windows-x86_64.exe
          chmod +x dist/winwork-linux-x86_64 dist/winwork-macos-x86_64 dist/winwork-macos-arm64

      - name: SHA256 checksums
        run: |
          cd dist
          sha256sum winwork-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to release
        env:
          TAG: ${{ github.ref }}
        run: |
          # Get tag name
          TAG_NAME="${TAG##refs/tags/}"
          echo "Uploading to release: $TAG_NAME"
          gh release upload "$TAG_NAME" dist/winwork-linux-x86_64 --clobber
          gh release upload "$TAG_NAME" dist/winwork-macos-x86_64 --clobber
          gh release upload "$TAG_NAME" dist/winwork-macos-arm64 --clobber
          gh release upload "$TAG_NAME" dist/winwork-windows-x86_64.exe --clobber
          gh release upload "$TAG_NAME" dist/SHA256SUMS.txt --clobber
