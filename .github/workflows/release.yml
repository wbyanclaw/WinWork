name: Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: winwork-windows-x86_64
            binary: winwork.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 5

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release if not exists
        env:
          TAG: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${TAG##refs/tags/}"
          if gh release view "$TAG_NAME" --repo ${{ github.repository }} 2>/dev/null; then
            echo "Release $TAG_NAME already exists"
          else
            echo "Creating release $TAG_NAME"
            gh release create "$TAG_NAME" --title "winwork $TAG_NAME" --repo ${{ github.repository }}
          fi

      - name: Attach to release
        env:
          TAG: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${TAG##refs/tags/}"
          echo "Uploading to $TAG_NAME"
          for f in artifacts/*/*; do
            echo "Uploading $(basename "$f")"
            gh release upload "$TAG_NAME" "$f" --clobber --repo ${{ github.repository }}
          done
