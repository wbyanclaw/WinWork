name: Build & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: winwork-ubuntu-x86_64
          - platform: macos-14
            target: aarch64-apple-darwin
            artifact: winwork-macos-arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            artifact: winwork-macos-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: winwork-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build Tauri app
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build (direct cargo)
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
        env:
          CARGO_INCREMENTAL: "0"

      - name: Upload binary
        uses: actions/upload-release-asset@v1
        if: github.event_name == 'release'
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: src-tauri/target/${{ matrix.target }}/release/WinWork${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
          asset_name: ${{ matrix.artifact }}${{ matrix.platform == 'windows-latest' && '.exe' || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/WinWork${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
          retention-days: 7

      # Attach to release if this is a release build
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          ASSET_PATH: src-tauri/target/${{ matrix.target }}/release/WinWork${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
          ASSET_NAME: ${{ matrix.artifact }}${{ matrix.platform == 'windows-latest' && '.exe' || '' }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$ASSET_PATH" --clobber
