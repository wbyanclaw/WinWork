<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>winwork</title>
  <!-- Local CSS (no CDN dependency, works offline/China) -->
  <link rel="stylesheet" href="styles.css">
  <script>
    // ── Enhanced Logging System ────────────────────────────────
    window._logBuffer = [];
    window._debugVisible = false;

    window._log = function() {
      var args = Array.from(arguments);
      var ts = new Date().toISOString().split('T')[1].slice(0,8);
      var msg = '[winwork ' + ts + '] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
      console.log.apply(console, arguments);

      // Buffer logs
      window._logBuffer.push({ts, msg, type: 'info'});
      if (window._logBuffer.length > 200) window._logBuffer.shift();

      // Show in debug panel if open
      if (window._debugVisible) {
        var logContent = document.getElementById('debugLogContent');
        if (logContent) {
          logContent.innerHTML += '<div><span class="timestamp">[' + ts + ']</span> ' + escHtml(args.join(' ')) + '</div>';
          logContent.scrollTop = logContent.scrollHeight;
        }
      }
    };

    function toggleDebugLog() {
      var panel = document.getElementById('debugLog');
      if (!panel) return;
      window._debugVisible = !window._debugVisible;
      if (window._debugVisible) {
        panel.classList.remove('hidden');
        panel.classList.add('open');
        var logContent = document.getElementById('debugLogContent');
        if (logContent) {
          logContent.innerHTML = window._logBuffer.map(function(l) {
            return '<div><span class="timestamp">[' + l.ts + ']</span> ' + escHtml(l.msg) + '</div>';
          }).join('');
          logContent.scrollTop = logContent.scrollHeight;
        }
      } else {
        panel.classList.add('hidden');
        panel.classList.remove('open');
      }
    }

    window._log('SCRIPT: loaded');
  </script>
  <script>
    // ── Lucide icons with local fallback ─────────────────────────
    (function() {
      // Try local first
      try {
        // Check if lucide is already loaded globally
        if (typeof lucide !== 'undefined') {
          window._lucideReady = true;
          return;
        }
      } catch(e) {}

      // Try loading from CDN, but don't block if it fails
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js';
      script.onload = function() { window._lucideReady = true; window._log && window._log('LUCIDE: loaded from CDN'); };
      script.onerror = function() {
        window._lucideReady = false;
        window._log && window._log('LUCIDE: failed - using emoji fallback');
        // Show modal icon buttons with emojis as fallback
        var modalBtnIcon = document.getElementById('modal-btn-icon');
        if (modalBtnIcon && !modalBtnIcon.textContent) {
          modalBtnIcon.textContent = '⚡';
        }
      };
      document.head.appendChild(script);
    })();
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#1d4ed8',
            brandLight: '#eff6ff',
            ink: '#0f172a',
            muted: '#64748b',
            faint: '#94a3b8',
            border: '#e2e8f0',
            success: '#059669',
            successBg: '#ecfdf5',
          }
        }
      }
    }
  </script>
  <style>

    #rightPanel.open { transform: translateX(0); }
    #debugLog { transform: translateY(100%); transition: transform 0.3s ease; position: fixed; bottom: 0; left: 0; right: 0; height: 200px; background: #1a1a2e; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; overflow-y: auto; z-index: 9999; }
    #debugLog.open { transform: translateY(0); }
    #debugLog .timestamp { color: #666; }
    #debugLog .error { color: #f55; }

    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    textarea { resize: none; }

    .tree-item:hover { background: #f8fafc; }

    .titlebar-btn { width: 46px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; cursor: pointer; color: #64748b; transition: background 0.1s, color 0.1s; }

    .modal-card { background: white; border-radius: 16px; padding: 40px 32px; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  </style>

  <script>
    try { if(window.lucide && window._lucideReady) lucide.createIcons(); } catch(e) { window._log && window._log("lucide.createIcons() failed:", e); }

    // ── API Key Storage (obfuscated, not plaintext) ─────────────
    // Simple XOR obfuscation to prevent casual localStorage reading.
    // Not real encryption — adequate for demo app; swap for tauri-plugin-store for production.
    const _apiKeyObfuscationKey = 'winwork_v029_xor';
    function _xorObfuscate(str) {
      const k = _apiKeyObfuscationKey;
      let out = '';
      for (let i = 0; i < str.length; i++) {
        out += String.fromCharCode(str.charCodeAt(i) ^ k.charCodeAt(i % k.length));
      }
      return btoa(out);
    }
    function _xorDeobfuscate(b64) {
      try {
        const str = atob(b64);
        const k = _apiKeyObfuscationKey;
        let out = '';
        for (let i = 0; i < str.length; i++) {
          out += String.fromCharCode(str.charCodeAt(i) ^ k.charCodeAt(i % k.length));
        }
        return out;
      } catch(e) { return ''; }
    }
    function _loadApiKey() {
      const stored = localStorage.getItem('minimax_api_key_obf');
      return stored ? _xorDeobfuscate(stored) : '';
    }
    function _saveApiKey(key) {
      if (key) localStorage.setItem('minimax_api_key_obf', _xorObfuscate(key));
      else localStorage.removeItem('minimax_api_key_obf');
    }
    function _loadBaseUrl() {
      return localStorage.getItem('winwork_api_base_url') || 'https://df.dawnloadai.com:9888/v1';
    }
    function _saveBaseUrl(url) {
      localStorage.setItem('winwork_api_base_url', url);
    }
    function _loadModel() {
      return localStorage.getItem('winwork_api_model') || 'MiniMax-M2.7-highspeed';
    }
    function _saveModel(model) {
      localStorage.setItem('winwork_api_model', model);
    }
    let apiKey = _loadApiKey();
    let apiBaseUrl = _loadBaseUrl();
    let apiModel = _loadModel();
    updateApiKeyStatus();

    // ── API Key Management ───────────────────────────────────
    function showApiKeyModal() {
      document.getElementById('apiKeyModal').classList.remove('hidden');
      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('apiBaseUrlInput').value = apiBaseUrl;
      document.getElementById('apiModelInput').value = apiModel;
      document.getElementById('wikiPathInput').value = appState.wikiPath || '';
      try { if(window.lucide && window._lucideReady) lucide.createIcons(); } catch(e) { window._log && window._log("lucide.createIcons() failed:", e); }
    }

    function hideApiKeyModal() {
      document.getElementById('apiKeyModal').classList.add('hidden');
    }

    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      apiBaseUrl = document.getElementById('apiBaseUrlInput').value.trim();
      apiModel = document.getElementById('apiModelInput').value.trim();
      const wikiPath = document.getElementById('wikiPathInput').value.trim();
      _saveApiKey(apiKey);
      _saveBaseUrl(apiBaseUrl);
      _saveModel(apiModel);
      appState.wikiPath = wikiPath;
      saveGlobalState();
      updateApiKeyStatus();
      hideApiKeyModal();
    }

    function clearApiKey() {
      apiKey = '';
      _saveApiKey('');
      document.getElementById('apiKeyInput').value = '';
      updateApiKeyStatus();
    }

    function updateApiKeyStatus() {
      const status = document.getElementById('apiKeyStatus');
      const btn = document.getElementById('apiKeyBtn');
      if (apiKey) {
        status.textContent = 'AI 已启用';
        btn.classList.add('text-emerald-600');
      } else {
        status.textContent = '设置API';
        btn.classList.remove('text-emerald-600');
      }
    }

    // ── File Tree ──────────────────────────────────────────────
    async function loadFileTree() {
      const container = document.getElementById('fileTree');
      if (!container) return;

      try {
        const result = await invoke('list_workspace');
        container.innerHTML = '';

        if (result.ok && result.data && result.data.entries) {
          const entries = result.data.entries;

          if (entries.length === 0) {
            container.innerHTML = '<div class="px-4 py-2 text-xs text-faint">工作区为空</div>';
            return;
          }

          // Sort: directories first, then files
          entries.sort((a, b) => {
            if (a.is_dir && !b.is_dir) return -1;
            if (!a.is_dir && b.is_dir) return 1;
            return a.name.localeCompare(b.name);
          });

          entries.forEach(entry => {
            const div = document.createElement('div');
            div.className = 'tree-item flex items-center gap-2 px-3 py-1.5 cursor-pointer text-sm text-slate-600';
            div.innerHTML = `
              <span class="w-4 h-4 flex items-center justify-center">${entry.is_dir ? '📁' : '📄'}</span>
              <span class="truncate">${escHtml(entry.name)}</span>
            `;
            if (!entry.is_dir) {
              div.onclick = () => showFileContent(entry.name);
            }
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<div class="px-4 py-2 text-xs text-faint">无法加载文件</div>';
        }
      } catch(e) {
        container.innerHTML = '<div class="px-4 py-2 text-xs text-faint">加载失败</div>';
      }
      try { if(window.lucide && window._lucideReady) lucide.createIcons(); } catch(e) { window._log && window._log("lucide.createIcons() failed:", e); }
    }

    async function showFileContent(filename) {
      const result = await invoke('read_file', { path: filename });
      if (result.ok && result.data && result.data.content) {
        const file = document.getElementById('detail-file');
        if (file) {

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function highlightJSON(obj) {
      const s = JSON.stringify(obj, null, 2);
      return s
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"([^"]+)":/g, '<span style="color:#1d4ed8">"$1"</span>:')
        .replace(/: "([^"]+)"/g, ': <span style="color:#059669">"$1"</span>')
        .replace(/: (true|false)/g, ': <span style="color:#d97706">$1</span>')
        .replace(/: (\d+)/g, ': <span style="color:#7c3aed">$1</span>');
    }

    /// Strip AI model internal tokens (<think>...</think>,<think>, etc.)
    /// so only the actual response is shown to the user.
    function _sanitizeAiResponse(text) {
      // Remove XML-style think blocks (e.g. <think>...</think> or (<think>)...(</think>))
      let s = text
        .replace(/<think>[\s\S]*?<\/think>/gi, '')
        .replace(/\(<think>\)[\s\S]*?\)/gi, '')
        .replace(/<think>[\s\S]*?/gi, '')
        .replace(/<\/think>/gi, '');
      // Trim whitespace
      s = s.trim();
      // Escape HTML and convert newlines
      return escHtml(s).replace(/\n/g, '<br>');
    }

    function resize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 96) + 'px';

    // ── Command router ───────────────────────────────────────
    function routeCommand(text) {
      const t = text.toLowerCase();
      if (t.includes('列出') || t.includes('list') || t.includes('ls') || t.includes('文件')) return 'ls';
      if (t.includes('创建') || t.includes('mkdir') || t.includes('目录') || t.includes('新建')) return 'mkdir';
      if (t.includes('写') || t.includes('put') || t.includes('创建文件')) return 'write';
      if (t.includes('wft') || t.includes('打开') || t.includes('open')) return 'wft';
      if (t.includes('知识库查询') || t.includes('wiki query') || t.includes('查知识')) return 'wiki_query';
      if (t.includes('知识库入库') || t.includes('wiki ingest') || t.includes('文档入库')) return 'wiki_ingest';
      if (t.includes('wiki lint') || t.includes('健康检查') || t.includes('wiki status')) return 'wiki_status';
      return 'ls'; // default
    }

    function buildArgs(key, text) {
      switch (key) {
        case 'ls': return ['ls'];  // Backend will add --json and workspace path
        case 'write': return ['write', 'test.txt', '--stdin'];
        case 'wiki_status': return ['wiki', 'status'];  // Backend handles --json
        case 'wiki_lint': return ['wiki', 'lint'];  // Backend handles --json
        default: return ['ls'];  // Backend will add --json and workspace path
      }
    }

    // ── Send ─────────────────────────────────────────────────
    async function send() {
      const inp = document.getElementById('input');
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      resize(inp);

      const msgs = document.getElementById('messages');
      document.getElementById('welcomeScreen')?.remove();

      // Human message
      appendMessage('user', text, msgs);
      const aid = 'm' + Date.now();

      // Thinking state
      appendAgentThinking(aid, msgs);
      try { if(window.lucide && window._lucideReady) lucide.createIcons(); } catch(e) { window._log && window._log("lucide.createIcons() failed:", e); }
      msgs.scrollTop = msgs.scrollHeight;

      try {
        let result;
        let responseText;

        if (apiKey) {
          // Use AI chat mode
          const aiResult = await invoke('ai_chat', { message: text, apiKey: apiKey, baseUrl: apiBaseUrl, model: apiModel });
          result = aiResult;
          responseText = aiResult.response;

          // Update bubble with AI response
          setTimeout(() => {
            const bubble = document.getElementById(aid + '-bubble');
            if (!bubble) return;

            let commandsHtml = '';
            if (aiResult.commands_executed && aiResult.commands_executed.length > 0) {
              commandsHtml = '<div class="mt-3 space-y-2">';
              aiResult.commands_executed.forEach((cmd, i) => {
                const cmdResult = aiResult.command_results[i];
                commandsHtml += `
                  <div class="bg-slate-50 border border-border rounded-lg px-3 py-2">
                    <div class="font-mono text-[11px] text-brand mb-1">$ wind ${escHtml(cmd)}</div>
                    ${cmdResult.ok ? '<span class="text-[10px] text-emerald-600">✓ 成功</span>' : '<span class="text-[10px] text-red-500">✗ 失败</span>'}
                  </div>`;
              });
              commandsHtml += '</div>';
            }

            bubble.innerHTML = `
              <p class="mb-2">${escHtml(text)}</p>
              <div class="text-sm leading-relaxed whitespace-pre-wrap">${_sanitizeAiResponse(responseText)}</div>
              ${commandsHtml}`;

            try { if(window.lucide && window._lucideReady) lucide.createIcons(); } catch(e) { window._log && window._log("lucide.createIcons() failed:", e); }
            msgs.scrollTop = msgs.scrollHeight;
          }, 500);
        } else {
          // Use keyword routing mode
          const key = routeCommand(text);

          // Dedicated commands use their own Tauri invocations
          if (key === 'wiki_query') {
            const question = text.replace(/知识库查询|wiki query|查知识/gi, '').trim() || '介绍你自己';
            result = await invoke('wiki_query', { question });
            displayWindResult(aid, text, result, 'wiki query');
          } else if (key === 'wiki_ingest') {
            const m = text.match(/(?:知识库入库|wiki ingest|文档入库)[:：]?\s*(\S+)/i);
            const path = m ? m[1] : prompt('请输入要入库的文件路径：');
            if (!path) { document.getElementById(aid + '-bubble').innerHTML = '<p>已取消</p>'; return; }
            result = await invoke('wiki_ingest', { path });
            displayWindResult(aid, text, result, 'wiki ingest');
          } else if (key === 'mkdir') {
            // Extract path with simple token grab (no fragile regex split)
            const tokens = text.split(/\s+/).filter(t => t && !/^[^\s\u4e00-\u9fff]+$/.test(t) || t.length > 1);
            const path = tokens[tokens.length - 1] || 'newdir';
            result = await invoke('mkdir_dir', { path });
            displayWindResult(aid, text, result, 'mkdir');
          } else if (key === 'wft') {
            const tokens = text.split(/\s+/).filter(t => t && !/^[^\s\u4e00-\u9fff]+$/.test(t) || t.length > 1);
            const file = tokens[tokens.length - 1] || 'test.txt';
            result = await invoke('wft_open', { file });
            displayWindResult(aid, text, result, 'wft');
          } else {
            const args = buildArgs(key, text);
            result = await invoke('run_wind_command', { args });
            displayWindResult(aid, text, result, args[0]);
          }
        }

        lastResult = result;
      } catch (e) {
        const bubble = document.getElementById(aid + '-bubble');
        if (bubble) {
          bubble.innerHTML = `<p>⚠️ 无法执行命令: ${escHtml(String(e))}</p>`;
        }
      }
    }

    // ── Tauri invoke wrapper with timeout ────────────────────────
    async function invoke(cmd, args = {}, timeoutMs = 10000) {
      if (typeof window.__TAURI__ !== 'undefined') {
        const { invoke: tauriInvoke } = window.__TAURI__.core;
        const timeoutPromise = new Promise((resolve) =>
          setTimeout(() => resolve({ _timeout: true, cmd, timeoutMs }), timeoutMs)
        );
        try {
          const result = await Promise.race([tauriInvoke(cmd, args), timeoutPromise]);
          if (result === null || result === undefined) {
            window._log && window._log(`invoke ${cmd} returned null`);
            return { ok: false, stderr: `invoke null: ${cmd}`, stdout: '', exit_code: -1, data: null };
          }
          if (result._timeout) {
            window._log && window._log(`invoke ${cmd} timed out after ${timeoutMs}ms`);
            return { ok: false, stderr: `invoke timeout: ${cmd} (>${timeoutMs}ms)`, stdout: '', exit_code: -1, data: null };
          }
          return result;
        } catch(e) {
          // Handle errors gracefully - don't crash on malformed errors
          const errMsg = e && typeof e === 'object' ? (e.message || String(e)) : String(e || 'unknown error');
          window._log && window._log(`invoke ${cmd} failed:`, errMsg);
          return { ok: false, stderr: errMsg, stdout: '', exit_code: -1, data: null };
        }
      } else {
        // Fallback: simulate for browser dev
        return { ok: true, data: { entries: [] }, stderr: '' };
      }
    }

    // ==========================================================================
    // State Persistence — winwork v0.2
    // Storage: Tauri backend → ~/.winwork/ (via save_state / load_state)
    // Layout:
    //   ~/.winwork/state.json          — global: active workspace
    //   ~/.winwork/workspaces/<name>/chat.json    — chat history
    //   ~/.winwork/workspaces/<name>/tree_state.json — file tree state
    //   ~/.winwork/workspaces/<name>/settings.json  — workspace settings
    // ==========================================================================

    // Current app state (in-memory)
    let appState = {
      activeWorkspace: 'default',
      workspaces: [],
      rightPanelTab: 'trace',
      wikiPath: '', // empty = use default wind wiki path
      // chatMessages: [], // loaded dynamically
    };

    // Load global state.json and initialize default workspace on first launch
    async function loadAppState() {
      try {
        const state = await invoke('load_state', { relativePath: 'state.json' });
        if (state && state !== null && typeof state === 'object') {
          appState.activeWorkspace = state.activeWorkspace || 'default';
          appState.rightPanelTab = state.rightPanelTab || 'trace';
          appState.wikiPath = state.wikiPath || '';
        }
      } catch(e) {
        // state.json doesn't exist yet — use defaults
        appState.activeWorkspace = 'default';
      }

      // Ensure default workspace exists
      try {
        await invoke('ensure_workspace_dir', { name: appState.activeWorkspace });
      } catch(e) {}

      // Load workspace-level state
      await loadWorkspaceState();

      // Restore right panel tab
      const tabId = 'tab-' + appState.rightPanelTab;
      const tabBtn = document.getElementById(tabId);
      if (tabBtn) switchTab(appState.rightPanelTab, tabBtn);
    }

    // Load chat history and tree state for the active workspace
    async function loadWorkspaceState() {
      const ws = appState.activeWorkspace;
      try {
        const chat = await invoke('load_state', { relativePath: `workspaces/${ws}/chat.json` });
        if (chat && chat !== null && Array.isArray(chat.messages)) {
          restoreChatHistory(chat.messages);
        }
      } catch(e) {}

      try {
        const tree = await invoke('load_state', { relativePath: `workspaces/${ws}/tree_state.json` });
        if (tree && tree !== null) {
          // tree expansion state will be used when loadFileTree renders items
          window._treeState = tree.expanded || [];
        }
      } catch(e) {}
    }

    // Restore chat history from persisted messages array
    function restoreChatHistory(messages) {
      const container = document.getElementById('messages');
      if (!container) return;
      document.getElementById('welcomeScreen')?.remove();
      messages.forEach(msg => {
        if (msg.role === 'user') {
          appendMessage('user', msg.text, container);
        } else {
          appendMessage('agent', msg.text, container);
        }
      });
    }

    // Save current chat messages to the active workspace
    async function saveChatHistory() {
      const container = document.getElementById('messages');
      if (!container) return;
      const bubbles = container.querySelectorAll('.msg');
      const messages = [];
      bubbles.forEach(bubble => {
        if (bubble.classList.contains('user')) {
          const text = bubble.querySelector('.bg-brand')?.textContent?.trim() || '';
          if (text) messages.push({ role: 'user', text });
        } else if (bubble.classList.contains('agent') || (bubble.querySelector('.bg-white') && !bubble.classList.contains('user'))) {
          const text = bubble.querySelector('.bg-white')?.textContent?.trim() ||
                       bubble.querySelector('[id$="-bubble"]')?.textContent?.trim() || '';
          if (text) messages.push({ role: 'agent', text });
        }
      });
      try {
        await invoke('save_state', {
          relativePath: `workspaces/${appState.activeWorkspace}/chat.json`,
          data: { messages }
        });
      } catch(e) {
        console.error('Failed to save chat history:', e);
      }
    }

    // Save right panel tab state (per workspace)
    async function saveRightPanelTab(tabName) {
      appState.rightPanelTab = tabName;
      try {
        await invoke('save_state', {
          relativePath: `workspaces/${appState.activeWorkspace}/settings.json`,
          data: { rightPanelTab: tabName }
        });
      } catch(e) {
        console.error('Failed to save right panel tab:', e);
      }
    }

    // Update global state (active workspace + wiki path)
    async function saveGlobalState() {
      try {
        await invoke('save_state', {
          relativePath: 'state.json',
          data: {
            activeWorkspace: appState.activeWorkspace,
            rightPanelTab: appState.rightPanelTab,
            wikiPath: appState.wikiPath,
          }
        });
      } catch(e) {
        console.error('Failed to save global state:', e);
      }
    }

    // Switch active workspace
    async function switchWorkspace(name) {
      if (name === appState.activeWorkspace) return;
      // Save current chat before switching
      await saveChatHistory();
      appState.activeWorkspace = name;
      try {
        await invoke('ensure_workspace_dir', { name });
      } catch(e) {}
      await saveGlobalState();
      await loadWorkspaceState();
      await loadFileTree();
    }

    // Patch appendMessage to auto-save chat after each message
    const _origAppendMessage = appendMessage;
    appendMessage = function(role, text, container) {
      _origAppendMessage(role, text, container);
      // Debounced save — don't block UI
      clearTimeout(window._chatSaveTimer);
      window._chatSaveTimer = setTimeout(() => saveChatHistory(), 2000);
    };

    // Patch switchTab to persist tab selection per workspace
    const _origSwitchTab = switchTab;
    switchTab = function(name, btn) {
      _origSwitchTab(name, btn);
      saveRightPanelTab(name);
    };

    // ── Init (updated for persistence) ───────────────────────
    async function init() {
      window._log('INIT: starting');
      updateStatusBar('loading', '正在启动...');
      try { if(window.lucide && window._lucideReady) lucide.createIcons(); } catch(e) { window._log && window._log("lucide.createIcons() failed:", e); }

      // Run env check with timeout - don't block entire init
      try {
        updateStatusBar('loading', '检查环境...');
        await Promise.race([
          checkAllEnv(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('env check timeout')), 8000))
        ]);
        window._log('INIT: env check done');
      } catch(e) {
        window._log && window._log('INIT: env check failed/timeout:', e.message);
        // Continue anyway - modal will handle missing env
        envState = { windcli: false, llmwiki: false };
      }

      // Load app state with timeout
      try {
        updateStatusBar('loading', '加载状态...');
        await Promise.race([
          loadAppState(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('load state timeout')), 5000))
        ]);
        window._log('INIT: state loaded');
      } catch(e) {
        window._log && window._log('INIT: state load failed:', e.message);
      }

      // Ensure workspace init completes before entering UI
      try {
        updateStatusBar('loading', '初始化工作区...');
        await Promise.race([
          initWorkspace(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('init workspace timeout')), 10000))
        ]);
        window._log('INIT: workspace ready');
      } catch(e) {
        window._log && window._log('INIT: workspace init failed/timeout:', e.message);
      }

      // Load file tree with timeout
      try {
        updateStatusBar('loading', '加载文件...');
        await Promise.race([
          loadFileTree(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('load file tree timeout')), 5000))
        ]);
      } catch(e) {
        window._log && window._log('INIT: file tree load failed:', e.message);
      }

      // Close install modal and enter main UI (only if windcli is available)
      if (envState.windcli) {
        enterMainUI();
      }

      updateStatusBar('ready', '就绪');
      window._log('INIT: complete');
    }

    // ── Workspace Initialization ─────────────────────────────
    async function initWorkspace() {
      try {
        const result = await invoke('init_demo_workspace');
        if (result && !result.ok) {
          window._log && window._log('initWorkspace: wind init 失败', result.stderr);
        } else {
          window._log && window._log('initWorkspace: workspace 初始化成功');
        }
      } catch(e) {
        window._log && window._log('initWorkspace: 异常', e);
      }
    }

    // ── Status Bar Helper ────────────────────────────────────────
    function updateStatusBar(state, message) {
      const statusBar = document.getElementById('envStatusBar');
      if (!statusBar) return;
      window._log && window._log('状态:', state, message);
      let colorClass = 'text-faint';
      let bgClass = 'bg-slate-50';
      let borderClass = 'border-border';
      let dotColor = 'bg-slate-400';
      switch(state) {
        case 'loading': colorClass='text-amber-600'; bgClass='bg-amber-50'; borderClass='border-amber-200'; dotColor='bg-amber-400 pulse-dot'; break;
        case 'ready': colorClass='text-emerald-600'; bgClass='bg-emerald-50'; borderClass='border-emerald-200'; dotColor='bg-emerald-500'; break;
        case 'error': colorClass='text-red-600'; bgClass='bg-red-50'; borderClass='border-red-200'; dotColor='bg-red-500'; break;
      }
      statusBar.innerHTML = `
        <span class="flex items-center gap-1.5 ${bgClass} border ${borderClass} ${colorClass} text-[11px] px-2 py-0.5 rounded-full font-medium">
          <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span>
          ${escHtml(message)}
        </span>
        <button onclick="toggleDebugLog()" class="text-[10px] text-faint hover:text-muted ml-1" title="查看日志">[日志]</button>
      `;
    }

    // ── Start ─────────────────────────────────────────────────
    // Global error handler for uncaught exceptions
    window.addEventListener('error', function(e) {
      window._log('JS ERROR:', e.message, '@', e.filename, 'line', e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      window._log('UNHANDLED PROMISE REJECTION:', String(e.reason));
    });

    try { init(); } catch(e) { window._log('INIT: FATAL:', e.message, e.stack); }
  </script>
</body>
</html>
