<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>winwork</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <div id="debug-view" class="debug-view hidden"></div>
      <div id="messages" class="messages"></div>
      <footer class="input-area">
        <textarea id="input" placeholder="描述你的需求..." rows="1"></textarea>
        <button id="send-btn" onclick="app.send()">发送</button>
      </footer>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>设置</h2>
      <div class="form-group">
        <label>Base URL</label>
        <input type="text" id="api-base-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label>Model</label>
        <input type="text" id="api-model" placeholder="MiniMax-M2.7-highspeed">
      </div>
      <div class="modal-actions">
        <button onclick="app.closeSettings()">取消</button>
        <button onclick="app.saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="main.js"></script>
  <script src="js/utils/sanitize.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/log.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/command.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/ui/status.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/chat.js"></script>
  <script src="js/ui/cards.js"></script>
  <script src="js/ui/debug.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
